<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="118mm"
     viewBox="0 0 160 118">
<defs>
  <marker id="arrow" markerWidth="4" markerHeight="4" refX="3.7" refY="2"
          orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L4,2 L0,4 z" fill="#000"/>
  </marker>
</defs>
<rect x="0" y="0" width="160" height="118" fill="#fff"/>

<!-- Первая строка: C1 -> DES^-1 -> XOR C0 -> M1 -->
<text x="3" y="12" font-family="DejaVu Sans" font-size="4.2" font-weight="bold" fill="#000">Блок C1 искажён</text>

<rect x="8" y="20" width="24" height="10" fill="#fff" stroke="#000" stroke-width="0.55"/>
<text x="20" y="26.8" font-family="DejaVu Sans" font-size="4" text-anchor="middle" fill="#000">C1</text>
<line x1="10" y1="28" x2="30" y2="22" stroke="#000" stroke-width="0.55"/>

<polyline points="32,25 51,25" fill="none" stroke="#000" stroke-width="0.55" marker-end="url(#arrow)"/>
<rect x="51" y="19" width="31" height="12" fill="#fff" stroke="#000" stroke-width="0.55"/>
<text x="66.5" y="26.6" font-family="DejaVu Sans" font-size="4" text-anchor="middle" fill="#000">DES&#8315;&#185;</text>

<polyline points="82,25 89,25" fill="none" stroke="#000" stroke-width="0.55"/>
<circle cx="94" cy="25" r="5" fill="#fff" stroke="#000" stroke-width="0.55"/>
<line x1="90" y1="25" x2="98" y2="25" stroke="#000" stroke-width="0.55"/>
<line x1="94" y1="21" x2="94" y2="29" stroke="#000" stroke-width="0.55"/>
<polyline points="99,25 108,25" fill="none" stroke="#000" stroke-width="0.55" marker-end="url(#arrow)"/>
<text x="110" y="26.6" font-family="DejaVu Sans" font-size="4" fill="#000">M1 — искажён</text>
<text x="94" y="17" font-family="DejaVu Sans" font-size="3.6" text-anchor="middle" fill="#000">C0</text>

<!-- Вторая строка: C2 -> DES^-1 -> XOR C1 -> M2 -->
<rect x="8" y="50" width="24" height="10" fill="#fff" stroke="#000" stroke-width="0.55"/>
<text x="20" y="56.8" font-family="DejaVu Sans" font-size="4" text-anchor="middle" fill="#000">C2</text>
<polyline points="32,55 51,55" fill="none" stroke="#000" stroke-width="0.55" marker-end="url(#arrow)"/>
<rect x="51" y="49" width="31" height="12" fill="#fff" stroke="#000" stroke-width="0.55"/>
<text x="66.5" y="56.6" font-family="DejaVu Sans" font-size="4" text-anchor="middle" fill="#000">DES&#8315;&#185;</text>
<polyline points="82,55 89,55" fill="none" stroke="#000" stroke-width="0.55"/>
<circle cx="94" cy="55" r="5" fill="#fff" stroke="#000" stroke-width="0.55"/>
<line x1="90" y1="55" x2="98" y2="55" stroke="#000" stroke-width="0.55"/>
<line x1="94" y1="51" x2="94" y2="59" stroke="#000" stroke-width="0.55"/>
<polyline points="99,55 108,55" fill="none" stroke="#000" stroke-width="0.55" marker-end="url(#arrow)"/>
<text x="110" y="56.6" font-family="DejaVu Sans" font-size="4" fill="#000">M2 — изменён 1 бит</text>

<!-- Влияние C1 на гаммирование M2 -->
<polyline points="36,25 36,72 94,72 94,60" fill="none" stroke="#000" stroke-width="0.55" stroke-dasharray="2,1.2" marker-end="url(#arrow)"/>
<text x="42" y="70" font-family="DejaVu Sans" font-size="3.6" fill="#000">C1 влияет на M2</text>

<!-- Третья строка: C3...Cn не искажены -->
<text x="3" y="94" font-family="DejaVu Sans" font-size="4.2" font-weight="bold" fill="#000">Блоки C3…Cn не искажены</text>

<rect x="8" y="101" width="24" height="10" fill="#fff" stroke="#000" stroke-width="0.55"/>
<text x="20" y="107.8" font-family="DejaVu Sans" font-size="4" text-anchor="middle" fill="#000">C3</text>
<polyline points="32,106 51,106" fill="none" stroke="#000" stroke-width="0.55" marker-end="url(#arrow)"/>
<rect x="51" y="100" width="31" height="12" fill="#fff" stroke="#000" stroke-width="0.55"/>
<text x="66.5" y="107.6" font-family="DejaVu Sans" font-size="4" text-anchor="middle" fill="#000">DES&#8315;&#185;</text>
<polyline points="82,106 89,106" fill="none" stroke="#000" stroke-width="0.55"/>
<circle cx="94" cy="106" r="5" fill="#fff" stroke="#000" stroke-width="0.55"/>
<line x1="90" y1="106" x2="98" y2="106" stroke="#000" stroke-width="0.55"/>
<line x1="94" y1="102" x2="94" y2="110" stroke="#000" stroke-width="0.55"/>
<polyline points="99,106 108,106" fill="none" stroke="#000" stroke-width="0.55" marker-end="url(#arrow)"/>
<text x="110" y="107.6" font-family="DejaVu Sans" font-size="4" fill="#000">M3 — без искажений</text>
</svg>
