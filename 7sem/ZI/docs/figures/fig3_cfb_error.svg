<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="100mm"
     viewBox="0 0 160 100">
<defs>
  <marker id="arrow" markerWidth="4" markerHeight="4" refX="3.7" refY="2"
          orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L4,2 L0,4 z" fill="#000"/>
  </marker>
</defs>
<rect x="0" y="0" width="160" height="100" fill="#fff"/>
<text x="5.00" y="9.00" font-family="DejaVu Sans" font-size="3.8" text-anchor="start" fill="#000" font-weight="bold">Распространение ошибки в режиме CFB (k = 8)</text>
<rect x="5" y="22" width="20" height="16" fill="#fff" stroke="#000" stroke-width="0.45"/>
<text x="15.00" y="31.15" font-family="DejaVu Sans" font-size="3.2" text-anchor="middle" fill="#000">P1</text>
<rect x="25" y="22" width="100" height="16" fill="#fff" stroke="#000" stroke-width="0.45"/>
<text x="75.00" y="31.15" font-family="DejaVu Sans" font-size="3.2" text-anchor="middle" fill="#000">P2 … P9</text>
<rect x="125" y="22" width="30" height="16" fill="#fff" stroke="#000" stroke-width="0.45"/>
<text x="140.00" y="31.15" font-family="DejaVu Sans" font-size="3.2" text-anchor="middle" fill="#000">P10 …</text>
<text x="15.00" y="19.00" font-family="DejaVu Sans" font-size="3.2" text-anchor="middle" fill="#000">1 бит</text>
<text x="75.00" y="19.00" font-family="DejaVu Sans" font-size="3.2" text-anchor="middle" fill="#000">искажены</text>
<text x="140.00" y="19.00" font-family="DejaVu Sans" font-size="3.2" text-anchor="middle" fill="#000">верно</text>
<line x1="125" y1="16" x2="125" y2="42" stroke="#000" stroke-width="0.45" stroke-dasharray="3 2"/>
<text x="125.00" y="52.00" font-family="DejaVu Sans" font-size="2.8" text-anchor="middle" fill="#000">самосинхронизация</text>
<rect x="5" y="58" width="32" height="14" fill="#fff" stroke="#000" stroke-width="0.45"/>
<text x="21.00" y="66.08" font-family="DejaVu Sans" font-size="3.0" text-anchor="middle" fill="#000">C1 искажён</text>
<polyline points="37.00,65.00 48.00,65.00" fill="none" stroke="#000" stroke-width="0.45" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<rect x="48" y="58" width="42" height="14" fill="#fff" stroke="#000" stroke-width="0.45"/>
<text x="69.00" y="66.04" font-family="DejaVu Sans" font-size="2.9" text-anchor="middle" fill="#000">регистр 64 бита</text>
<polyline points="90.00,65.00 100.00,65.00" fill="none" stroke="#000" stroke-width="0.45" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<rect x="100" y="58" width="28" height="14" fill="#fff" stroke="#000" stroke-width="0.45"/>
<text x="114.00" y="66.08" font-family="DejaVu Sans" font-size="3.0" text-anchor="middle" fill="#000">DES</text>
<polyline points="128.00,65.00 140.00,65.00" fill="none" stroke="#000" stroke-width="0.45" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<text x="143.00" y="66.00" font-family="DejaVu Sans" font-size="3.0" text-anchor="start" fill="#000">P2…P9</text>
<text x="5.00" y="88.00" font-family="DejaVu Sans" font-size="2.9" text-anchor="start" fill="#000">C1 влияет на P2…P9 (8 байт), затем вытесняется из регистра;</text>
<text x="5.00" y="94.00" font-family="DejaVu Sans" font-size="2.9" text-anchor="start" fill="#000">P1 отличается ровно на 1 бит, а P10 и далее расшифровываются верно.</text>
</svg>
