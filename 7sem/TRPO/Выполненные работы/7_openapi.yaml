components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT сотрудника (гид или руководитель)
    clientToken:
      type: apiKey
      in: header
      name: X-Client-Token
      description: Токен клиента, выданный при оформлении договора
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      description: Поиск по названию/ФИО
      schema:
        type: string
        maxLength: 100
    Sort:
      name: sort
      in: query
      description: Поле сортировки; префикс "-" — по убыванию
      schema:
        type: string
        example: -startDateTime
    DateFromRequired:
      name: dateFrom
      in: query
      required: true
      schema:
        type: string
        format: date
    DateToRequired:
      name: dateTo
      in: query
      required: true
      schema:
        type: string
        format: date
    RouteId:
      name: routeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PointId:
      name: pointId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExcursionId:
      name: excursionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContractId:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Не передан или недействителен токен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Недостаточно прав
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Конфликт состояния ресурса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Ошибка валидации параметров
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          example: https://api.excursion-bureau.ru/problems/validation-error
        title:
          type: string
          example: Ошибка валидации
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: Поле excursionId обязательно
        instance:
          type: string
          example: /api/v1/contracts
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 137
        pages:
          type: integer
          example: 7
    LoginRequest:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
          example: guide.ivanov
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 3600
        role:
          type: string
          enum:
          - GUIDE
          - MANAGER
    Point:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Набережная Волги
        description:
          type: string
        country:
          type: string
          example: Россия
        locality:
          type: string
          example: Чебоксары
        latitude:
          type: number
          format: float
          example: 56.1463
        longitude:
          type: number
          format: float
          example: 47.2519
        order:
          type: integer
          example: 1
    PointInput:
      type: object
      required:
      - name
      - country
      - locality
      - latitude
      - longitude
      - order
      properties:
        name:
          type: string
        description:
          type: string
        country:
          type: string
        locality:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        order:
          type: integer
    Route:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Чебоксары исторические
        description:
          type: string
        durationHours:
          type: integer
          example: 3
        basePrice:
          type: number
          example: 1500.0
        maxGroupSize:
          type: integer
          example: 20
        ageRestriction:
          type: string
          example: 6+
        movementType:
          type: string
          enum:
          - walking
          - bus
        active:
          type: boolean
        points:
          type: array
          items:
            $ref: '#/components/schemas/Point'
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - durationHours
      - basePrice
      - maxGroupSize
      - movementType
      - active
    RouteInput:
      type: object
      required:
      - name
      - durationHours
      - basePrice
      - maxGroupSize
      - movementType
      properties:
        name:
          type: string
        description:
          type: string
        durationHours:
          type: integer
          minimum: 1
        basePrice:
          type: number
          minimum: 0
        maxGroupSize:
          type: integer
          minimum: 1
        ageRestriction:
          type: string
        movementType:
          type: string
          enum:
          - walking
          - bus
        active:
          type: boolean
          default: true
    Guide:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lastName:
          type: string
          example: Иванов
        firstName:
          type: string
          example: Иван
        middleName:
          type: string
          example: Иванович
        phone:
          type: string
          example: 79001234567
        email:
          type: string
          format: email
        specialization:
          type: string
          enum:
          - city
          - museum
          - mountain
        status:
          type: string
          enum:
          - available
          - busy
        externalContractor:
          type: boolean
        accessActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - lastName
      - firstName
      - phone
      - email
      - specialization
      - status
      - accessActive
    GuideInput:
      type: object
      required:
      - lastName
      - firstName
      - phone
      - email
      - specialization
      properties:
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        specialization:
          type: string
          enum:
          - city
          - museum
          - mountain
        externalContractor:
          type: boolean
        accessActive:
          type: boolean
    Transport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: автобус
        plateNumber:
          type: string
          example: А123ВС21
        capacity:
          type: integer
          example: 45
        driverPhone:
          type: string
          example: 79007654321
        status:
          type: string
          enum:
          - available
          - busy
        externalContractor:
          type: boolean
      required:
      - id
      - type
      - plateNumber
      - capacity
      - driverPhone
      - status
    TransportInput:
      type: object
      required:
      - type
      - plateNumber
      - capacity
      - driverPhone
      properties:
        type:
          type: string
        plateNumber:
          type: string
        capacity:
          type: integer
          minimum: 1
        driverPhone:
          type: string
        externalContractor:
          type: boolean
    Excursion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        routeId:
          type: string
          format: uuid
        routeName:
          type: string
          example: Чебоксары исторические
        guide:
          $ref: '#/components/schemas/Guide'
        transportId:
          type: string
          format: uuid
          nullable: true
        startDateTime:
          type: string
          format: date-time
          example: '2026-11-15T10:00:00+03:00'
        endDateTime:
          type: string
          format: date-time
          example: '2026-11-15T13:00:00+03:00'
        price:
          type: number
          example: 1500.0
        maxGroupSize:
          type: integer
          example: 20
        availableSeats:
          type: integer
          example: 12
        status:
          type: string
          enum:
          - scheduled
          - started
          - completed
          - closed
          - cancelled
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - routeId
      - routeName
      - guide
      - startDateTime
      - endDateTime
      - price
      - maxGroupSize
      - availableSeats
      - status
    ExcursionInput:
      type: object
      required:
      - routeId
      - startDateTime
      - endDateTime
      - price
      - maxGroupSize
      properties:
        routeId:
          type: string
          format: uuid
        guideId:
          type: string
          format: uuid
        transportId:
          type: string
          format: uuid
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        price:
          type: number
          minimum: 0
        maxGroupSize:
          type: integer
          minimum: 1
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        birthDate:
          type: string
          format: date
        phone:
          type: string
        email:
          type: string
          format: email
        passportSeries:
          type: string
        passportNumber:
          type: string
        registrationDate:
          type: string
          format: date
        consentPersonalData:
          type: boolean
      required:
      - id
      - lastName
      - firstName
      - phone
      - consentPersonalData
    Participant:
      type: object
      required:
      - lastName
      - firstName
      - passportSeries
      - passportNumber
      properties:
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        passportSeries:
          type: string
        passportNumber:
          type: string
    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        qrCode:
          type: string
        participantName:
          type: string
        attended:
          type: boolean
        status:
          type: string
          enum:
          - active
          - used
          - cancelled
        contractId:
          type: string
          format: uuid
        excursionId:
          type: string
          format: uuid
      required:
      - id
      - qrCode
      - participantName
      - attended
      - status
      - contractId
      - excursionId
    Contract:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: Д-2026-001234
        clientId:
          type: string
          format: uuid
        excursionId:
          type: string
          format: uuid
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        totalPrice:
          type: number
          example: 3000.0
        status:
          type: string
          enum:
          - draft
          - pending_payment
          - paid
          - completed
          - cancelled
          - refunded
          - annulled
        createdAt:
          type: string
          format: date-time
        paymentDeadline:
          type: string
          format: date-time
      required:
      - id
      - number
      - clientId
      - excursionId
      - participants
      - totalPrice
      - status
      - createdAt
    ContractInput:
      type: object
      required:
      - excursionId
      - participants
      - contactEmail
      - consentPersonalData
      properties:
        excursionId:
          type: string
          format: uuid
        participants:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/Participant'
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        consentPersonalData:
          type: boolean
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        externalTransactionId:
          type: string
          nullable: true
        amount:
          type: number
          example: 3000.0
        method:
          type: string
          enum:
          - card
          - sbp
          - cash
        dueDate:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - paid
          - declined
          - refunded
        statusChangedAt:
          type: string
          format: date-time
        declineReason:
          type: string
          nullable: true
      required:
      - id
      - contractId
      - amount
      - method
      - status
      - statusChangedAt
    PaymentInput:
      type: object
      required:
      - method
      properties:
        method:
          type: string
          enum:
          - card
          - sbp
        returnUrl:
          type: string
          format: uri
    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        excursionId:
          type: string
          format: uuid
        clientName:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - excursionId
      - rating
      - createdAt
    ReviewInput:
      type: object
      required:
      - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        excursionId:
          type: string
          format: uuid
        guideId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        text:
          type: string
        photoUrls:
          type: array
          items:
            type: string
            format: uri
        incidents:
          type: string
          nullable: true
        actualAttendance:
          type: integer
        status:
          type: string
          enum:
          - draft
          - sent
      required:
      - id
      - excursionId
      - guideId
      - createdAt
      - text
      - actualAttendance
      - status
    ReportInput:
      type: object
      required:
      - text
      - actualAttendance
      properties:
        text:
          type: string
          maxLength: 5000
        actualAttendance:
          type: integer
          minimum: 0
        incidents:
          type: string
          nullable: true
          maxLength: 2000
        photoUrls:
          type: array
          items:
            type: string
            format: uri
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - contract
          - invoice
          - ticket
          - boarding_list
          - route_sheet
        fileName:
          type: string
        url:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - contractId
      - type
      - fileName
      - url
      - createdAt
    Assignment:
      type: object
      properties:
        excursionId:
          type: string
          format: uuid
        guideId:
          type: string
          format: uuid
        transportId:
          type: string
          format: uuid
        assignedAt:
          type: string
          format: date-time
        reason:
          type: string
    AssignmentInput:
      type: object
      required:
      - guideId
      properties:
        guideId:
          type: string
          format: uuid
        transportId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          maxLength: 500
    ResourceAvailability:
      type: object
      properties:
        date:
          type: string
          format: date
        guides:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              fullName:
                type: string
              status:
                type: string
                enum:
                - available
                - busy
        transports:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              plateNumber:
                type: string
              capacity:
                type: integer
              status:
                type: string
                enum:
                - available
                - busy
    ErrorLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dateTime:
          type: string
          format: date-time
        resourceType:
          type: string
          enum:
          - guide
          - transport
        message:
          type: string
        excursionId:
          type: string
          format: uuid
          nullable: true
    AnalyticsSummary:
      type: object
      properties:
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        routeId:
          type: string
          format: uuid
        routeName:
          type: string
        excursionsCount:
          type: integer
        soldSeats:
          type: integer
        actualAttendance:
          type: integer
        revenue:
          type: number
        profitability:
          type: number
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum:
          - email
          - sms
        subject:
          type: string
        message:
          type: string
        sentAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - sent
          - failed
