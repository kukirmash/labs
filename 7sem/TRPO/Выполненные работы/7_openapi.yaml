openapi: 3.0.3
info:
  title: API информационной системы «Экскурсионное бюро»
  version: 1.0.0
  description: |
    REST API для клиентских приложений, мобильного рабочего места гида
    и АРМ руководителя ИС «Экскурсионное бюро».

    Базовый URL: https://api.excursion-bureau.ru/api/v1

    Аутентификация:
      * сотрудники (гид, руководитель) — Bearer JWT, полученный в POST /auth/login;
      * клиент — заголовок X-Client-Token, выданный при оформлении договора.

    Форматы: JSON (UTF-8); документы — PDF; аналитические отчёты — XLSX;
    загрузка фотографий — multipart/form-data.
  contact:
    name: Кафедра вычислительной техники ЧувГУ
servers:
- url: https://api.excursion-bureau.ru/api/v1
  description: Продуктивный сервер
- url: https://sandbox.excursion-bureau.ru/api/v1
  description: Тестовый сервер
tags:
- name: Auth
  description: Авторизация и профиль сотрудника
- name: Catalog
  description: Каталог маршрутов и экскурсий
- name: Contracts
  description: Договоры и электронные билеты
- name: Payments
  description: Платежи и возвраты
- name: Documents
  description: Пакеты документов
- name: Guide
  description: Мобильное рабочее место гида
- name: Manager
  description: Управление справочниками и реестрами
- name: Analytics
  description: Аналитика и отчёты
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Авторизация сотрудника (UC-32)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Обновление JWT по refresh-токену
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Текущий профиль сотрудника
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guide'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Завершение сессии
      responses:
        '204':
          description: Сессия завершена
        '401':
          $ref: '#/components/responses/Unauthorized'
  /routes:
    get:
      tags:
      - Catalog
      summary: Список маршрутов (UC-01, UC-02)
      security: []
      parameters:
      - $ref: '#/components/parameters/Search'
      - name: active
        in: query
        schema:
          type: boolean
          default: true
      - name: movementType
        in: query
        schema:
          type: string
          enum:
          - walking
          - bus
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница маршрутов
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Route'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
    post:
      tags:
      - Manager
      summary: Создать маршрут (UC-18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteInput'
      responses:
        '201':
          description: Маршрут создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /routes/{routeId}:
    parameters:
    - $ref: '#/components/parameters/RouteId'
    get:
      tags:
      - Catalog
      summary: Детали маршрута (UC-03)
      security: []
      responses:
        '200':
          description: Маршрут с точками
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Manager
      summary: Изменить маршрут (UC-18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteInput'
      responses:
        '200':
          description: Маршрут обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
      - Manager
      summary: Деактивировать маршрут (UC-18)
      responses:
        '204':
          description: Маршрут деактивирован
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /routes/{routeId}/points:
    parameters:
    - $ref: '#/components/parameters/RouteId'
    get:
      tags:
      - Catalog
      summary: Точки маршрута (UC-03)
      security: []
      responses:
        '200':
          description: Список точек
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Point'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Manager
      summary: Добавить точку в маршрут (UC-18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointInput'
      responses:
        '201':
          description: Точка добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Point'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /routes/{routeId}/points/{pointId}:
    parameters:
    - $ref: '#/components/parameters/RouteId'
    - $ref: '#/components/parameters/PointId'
    patch:
      tags:
      - Manager
      summary: Изменить точку маршрута (UC-18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointInput'
      responses:
        '200':
          description: Точка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Point'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Manager
      summary: Удалить точку из маршрута (UC-18)
      responses:
        '204':
          description: Точка удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /excursions:
    get:
      tags:
      - Catalog
      summary: Список экскурсий (UC-01, UC-02)
      security: []
      parameters:
      - name: routeId
        in: query
        schema:
          type: string
          format: uuid
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        schema:
          type: string
          format: date
      - name: status
        in: query
        schema:
          type: string
          enum:
          - scheduled
          - started
          - completed
          - closed
          - cancelled
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница экскурсий
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Excursion'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
    post:
      tags:
      - Manager
      summary: Создать экскурсию (UC-18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExcursionInput'
      responses:
        '201':
          description: Экскурсия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Excursion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /excursions/{excursionId}:
    parameters:
    - $ref: '#/components/parameters/ExcursionId'
    get:
      tags:
      - Catalog
      summary: Детали экскурсии (UC-03)
      security: []
      responses:
        '200':
          description: Экскурсия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Excursion'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Manager
      summary: Изменить экскурсию (UC-18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExcursionInput'
      responses:
        '200':
          description: Экскурсия обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Excursion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
      - Manager
      summary: Отменить экскурсию (UC-18)
      responses:
        '204':
          description: Экскурсия отменена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /excursions/{excursionId}/reviews:
    parameters:
    - $ref: '#/components/parameters/ExcursionId'
    get:
      tags:
      - Catalog
      summary: Отзывы об экскурсии (UC-11)
      security: []
      responses:
        '200':
          description: Список отзывов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
    post:
      tags:
      - Contracts
      summary: Оставить отзыв (UC-11)
      security:
      - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Отзыв создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /excursions/{excursionId}/start:
    parameters:
    - $ref: '#/components/parameters/ExcursionId'
    post:
      tags:
      - Guide
      summary: Начать экскурсию (UC-24)
      responses:
        '200':
          description: Экскурсия начата
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Excursion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /excursions/{excursionId}/finish:
    parameters:
    - $ref: '#/components/parameters/ExcursionId'
    post:
      tags:
      - Guide
      summary: Завершить экскурсию (UC-24)
      responses:
        '200':
          description: Экскурсия завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Excursion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /excursions/{excursionId}/tickets:
    parameters:
    - $ref: '#/components/parameters/ExcursionId'
    get:
      tags:
      - Guide
      summary: Билеты и посадочная ведомость экскурсии (UC-25)
      parameters:
      - name: attended
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Список билетов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '403':
          $ref: '#/components/responses/Forbidden'
  /excursions/{excursionId}/boarding-list:
    parameters:
    - $ref: '#/components/parameters/ExcursionId'
    get:
      tags:
      - Guide
      summary: Посадочная ведомость в JSON (UC-25, UC-30)
      responses:
        '200':
          description: Ведомость
          content:
            application/json:
              schema:
                type: object
                properties:
                  excursionId:
                    type: string
                    format: uuid
                  routeName:
                    type: string
                  startDateTime:
                    type: string
                    format: date-time
                  tickets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
  /excursions/{excursionId}/boarding-list.pdf:
    parameters:
    - $ref: '#/components/parameters/ExcursionId'
    get:
      tags:
      - Guide
      summary: Скачать посадочную ведомость и маршрутный лист (UC-30)
      responses:
        '200':
          description: PDF-файл
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /excursions/{excursionId}/reports:
    parameters:
    - $ref: '#/components/parameters/ExcursionId'
    post:
      tags:
      - Guide
      summary: Сформировать и отправить отчёт о проведении (UC-26)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
      responses:
        '201':
          description: Отчёт создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /excursions/{excursionId}/assignments:
    parameters:
    - $ref: '#/components/parameters/ExcursionId'
    post:
      tags:
      - Manager
      summary: Назначить гида и транспорт на экскурсию (UC-13, UC-18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentInput'
      responses:
        '201':
          description: Назначение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags:
      - Manager
      summary: Переназначить гида или транспорт (UC-13)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentInput'
      responses:
        '200':
          description: Назначение обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /contracts:
    post:
      tags:
      - Contracts
      summary: Оформить договор на экскурсию (UC-04)
      security: []
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
        description: Ключ идемпотентности повторного запроса
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractInput'
      responses:
        '201':
          description: Договор создан; возвращается клиентский токен
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract:
                    $ref: '#/components/schemas/Contract'
                  clientToken:
                    type: string
                    description: Токен доступа клиента к своим договорам
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags:
      - Contracts
      summary: История договоров клиента (UC-09) или реестр (UC-22)
      description: 'С X-Client-Token возвращает договоры текущего клиента.

        С JWT роли MANAGER возвращает реестр договоров с фильтрами.

        '
      security:
      - clientToken: []
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - draft
          - pending_payment
          - paid
          - completed
          - cancelled
          - refunded
          - annulled
      - name: dateFrom
        in: query
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список договоров
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /contracts/{contractId}:
    parameters:
    - $ref: '#/components/parameters/ContractId'
    get:
      tags:
      - Contracts
      summary: Детали договора (UC-09)
      security:
      - clientToken: []
      - bearerAuth: []
      responses:
        '200':
          description: Договор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /contracts/{contractId}/cancel:
    parameters:
    - $ref: '#/components/parameters/ContractId'
    post:
      tags:
      - Contracts
      summary: Инициировать отказ от договора (UC-10)
      security:
      - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Договор отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /contracts/{contractId}/documents:
    parameters:
    - $ref: '#/components/parameters/ContractId'
    get:
      tags:
      - Documents
      summary: Пакет документов по договору (UC-05, UC-07)
      security:
      - clientToken: []
      - bearerAuth: []
      responses:
        '200':
          description: Список документов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /contracts/{contractId}/documents/email:
    parameters:
    - $ref: '#/components/parameters/ContractId'
    post:
      tags:
      - Documents
      summary: Отправить копию пакета документов на email (UC-06)
      security:
      - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Запрос на отправку принят
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /contracts/{contractId}/documents/{documentId}:
    parameters:
    - $ref: '#/components/parameters/ContractId'
    - name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Documents
      summary: Скачать документ (UC-07)
      security:
      - clientToken: []
      - bearerAuth: []
      responses:
        '200':
          description: PDF-файл документа
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /contracts/{contractId}/tickets:
    parameters:
    - $ref: '#/components/parameters/ContractId'
    get:
      tags:
      - Documents
      summary: Электронные билеты договора (UC-05, UC-07)
      security:
      - clientToken: []
      - bearerAuth: []
      responses:
        '200':
          description: Список билетов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
  /contracts/{contractId}/tickets/{ticketId}/pdf:
    parameters:
    - $ref: '#/components/parameters/ContractId'
    - $ref: '#/components/parameters/TicketId'
    get:
      tags:
      - Documents
